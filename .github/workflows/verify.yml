# CI/CD entry point: verify (static checks + frontend tests) -> build-and-publish (GHCR) -> deploy (SSH + Docker Compose).
# This is the only workflow with triggers: every push to main and a manual run (Run workflow). The other two stages are
# reusable workflows (on: workflow_call) called from the jobs below, so the whole chain is one run: a stage starts only
# after the previous one succeeded (`needs` + `if`), and stage results are passed as workflow_call outputs.
#   build-and-publish.yml: called when verify found relevant changes; publishes <7-char SHA> and moves `latest`.
#   deploy.yml:            called for main when this run moved `latest` (push, or manual run with `deploy` checked).
# The first step of verify decides whether anything relevant changed: irrelevant pushes (documentation only) end with a
# successful verify and skipped publish/deploy instead of being filtered out by `paths`. Manual runs are always full.
# Java tests are intentionally not run here (too expensive for every push).
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production after verification and image publication'
        type: boolean
        required: false
        default: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  # Container package name in the namespace of the repository owner: ghcr.io/<owner>/heatnet (checked against
  # compose.prod.yaml below; build-and-publish.yml publishes the same name)
  IMAGE_NAME: heatnet

jobs:
  verify:
    name: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes relevant to the image and deployment
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Paths that influence the application image, the checks of this job or the deployment.
          # Anything else (README, docs, scripts, examples, ТЗ) does not trigger verify/publish/deploy.
          RELEVANT='^(src/|pom\.xml$|Dockerfile$|\.dockerignore$|docker-compose\.yml$|compose\.prod\.yaml$|caddy/|\.github/workflows/)'
          relevant=true
          reason=""
          if [ "$EVENT" != "push" ]; then
            reason="manual run ($EVENT): verification and publication run"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            reason="first push of the branch: no previous commit to compare, verification and publication run"
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            reason="previous commit $BEFORE is not available (force push / missing history): verification and publication run"
          elif ! changed=$(git -c core.quotePath=false diff --name-only "$BEFORE" "$AFTER"); then
            reason="git diff failed: verification and publication run"
          else
            {
              echo "### Changed files ($BEFORE..$AFTER)"
              echo '```'
              printf '%s\n' "${changed:-<none>}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if printf '%s\n' "$changed" | grep -Eq "$RELEVANT"; then
              reason="relevant files changed"
            else
              relevant=false
              reason="only files irrelevant to the image and deployment changed (e.g. documentation): verify, build-and-publish and deploy are skipped"
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "$reason"
          echo "**Pipeline:** $reason" >> "$GITHUB_STEP_SUMMARY"

      # ---- static checks: report problems, never rewrite files (no --fix, no formatters) ----

      - name: Workflow lint (actionlint + ShellCheck of run scripts)
        if: steps.detect.outputs.relevant == 'true'
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${tarball}\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          cd "$GITHUB_WORKSPACE"
          shellcheck --version | sed -n 2p
          # actionlint ${ACTIONLINT_VERSION} predates two documented GitHub features used here: the GA runner label
          # ubuntu-26.04 and `concurrency.queue`. Only these two exact messages are ignored.
          "$RUNNER_TEMP/actionlint" -no-color \
            -ignore 'label "ubuntu-26\.04" is unknown' \
            -ignore 'unexpected key "queue" for "concurrency" section'

      - name: YAML lint (yamllint)
        if: steps.detect.outputs.relevant == 'true'
        run: |
          # Syntax, duplicate keys, indentation, truthy values; long lines are allowed (comments are wide on purpose).
          yamllint --version
          git ls-files -z '*.yml' '*.yaml' | xargs -0 yamllint --strict -f github \
            -d '{extends: relaxed, rules: {line-length: disable}}'

      - name: Shell scripts (ShellCheck)
        if: steps.detect.outputs.relevant == 'true'
        run: |
          mapfile -d '' scripts < <(git ls-files -z '*.sh')
          [ ${#scripts[@]} -gt 0 ] || { echo "No shell scripts"; exit 0; }
          # Errors fail the job; warnings and style notes are reported in the log and the job summary.
          shellcheck --severity=error "${scripts[@]}"
          report=$(shellcheck -f gcc "${scripts[@]}" || true)
          printf '%s\n' "${report:-no findings}"
          echo "### ShellCheck" >> "$GITHUB_STEP_SUMMARY"
          echo "${#scripts[@]} script(s): no errors, $(printf '%s' "$report" | grep -c ': warning:\|: note:\|: info:' || true) warning/note(s) (report only)" >> "$GITHUB_STEP_SUMMARY"

      - name: Docker Compose and Caddyfile configuration
        if: steps.detect.outputs.relevant == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # Read-only: `config --quiet` only parses and interpolates; nothing is pulled, built or started.
          # No .env exists in the checkout, so the documented defaults are used.
          unset HEATNET_IMAGE_TAG
          docker compose -f docker-compose.yml config --quiet
          docker compose -f compose.prod.yaml config --quiet
          # compose.prod.yaml must run the image this workflow publishes: `latest` without HEATNET_IMAGE_TAG,
          # the pinned tag with it.
          expected="${REGISTRY}/${OWNER,,}/${IMAGE_NAME}"
          app_image() { docker compose -f compose.prod.yaml config --images app | grep -Fx -e "$1"; }
          app_image "${expected}:latest" \
            || { echo "::error file=compose.prod.yaml::app image does not resolve to ${expected}:latest"; exit 1; }
          HEATNET_IMAGE_TAG=a1b2c3d app_image "${expected}:a1b2c3d" \
            || { echo "::error file=compose.prod.yaml::HEATNET_IMAGE_TAG does not select the app image tag"; exit 1; }
          HEATNET_IMAGE_TAG='' app_image "${expected}:latest" \
            || { echo "::error file=compose.prod.yaml::an empty HEATNET_IMAGE_TAG does not fall back to latest"; exit 1; }
          # Caddyfile delivered to production: adapt and validate with the pinned Caddy image, offline, read-only mount.
          # (`config --images <service>` also lists dependencies, so the image is read from the JSON model)
          caddy_image=$(docker compose -f compose.prod.yaml config --format json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["services"]["caddy"]["image"])')
          docker run --rm --network none -e DOMAIN=heatnet.example.ru -e ACME_EMAIL=ops@example.ru \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy_image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Secret scan (gitleaks)
        if: steps.detect.outputs.relevant == 'true'
        env:
          GITLEAKS_VERSION: 8.30.1
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          # Scan the commits of this push; without a usable previous commit scan the whole working tree.
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="${BEFORE}..${AFTER}" .
          else
            "$RUNNER_TEMP/gitleaks" dir --no-banner --redact .
          fi

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: '24'

      - name: JavaScript syntax check
        if: steps.detect.outputs.relevant == 'true'
        run: |
          files=(src/main/resources/static/*.js src/test/js/*.cjs)
          for f in "${files[@]}"; do node --check "$f"; done
          echo "Syntax OK: ${#files[@]} files"

      - uses: actions/setup-java@v6
        if: steps.detect.outputs.relevant == 'true'
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Java static check (javac -Xlint:all, report)
        if: steps.detect.outputs.relevant == 'true'
        run: |
          # No linter is configured in pom.xml; compile the main sources with all javac lint categories enabled.
          # Only the dependency:build-classpath goal is invoked (no lifecycle phase, so no tests are compiled or run);
          # classes go to RUNNER_TEMP, the checkout is not written. Compilation errors fail the job; lint warnings
          # are reported in the log and the job summary.
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/classpath.txt"
          find src/main/java -name '*.java' > "$RUNNER_TEMP/sources.txt"
          mkdir -p "$RUNNER_TEMP/lint-classes"
          javac -Xlint:all -Xmaxwarns 10000 -proc:none -encoding UTF-8 --release 11 \
            -cp "$(cat "$RUNNER_TEMP/classpath.txt")" -d "$RUNNER_TEMP/lint-classes" \
            @"$RUNNER_TEMP/sources.txt" 2>&1 | tee "$RUNNER_TEMP/javac-lint.txt"
          warnings=$(grep -c ': warning:' "$RUNNER_TEMP/javac-lint.txt" || true)
          echo "### Java static check" >> "$GITHUB_STEP_SUMMARY"
          echo "javac -Xlint:all: compilation OK, ${warnings} warning(s) (report only)" >> "$GITHUB_STEP_SUMMARY"

      # ---- tests: frontend only (Java tests are intentionally not run in CI) ----

      - name: Frontend tests
        if: steps.detect.outputs.relevant == 'true'
        run: node --test src/test/js/*.test.cjs

      - name: Checks did not modify the checkout
        if: steps.detect.outputs.relevant == 'true'
        run: |
          changes=$(git status --porcelain --untracked-files=all)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "::error::A check modified or created files in the checkout"
            exit 1
          fi
          echo "Working tree unchanged"

  build-and-publish:
    name: build-and-publish
    needs: verify
    if: needs.verify.outputs.relevant == 'true'
    # the reusable workflow cannot get more than this job grants
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-and-publish.yml

  deploy:
    name: deploy
    needs: [verify, build-and-publish]
    # Automatic for a push to main; for a manual run of main only with `deploy` checked (default). Only a run that
    # moved `latest` deploys: an older run that finished after a newer one leaves deployment to the newer run.
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.relevant == 'true' && needs.build-and-publish.outputs.latest == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.build-and-publish.outputs.image }}
      tag: ${{ needs.build-and-publish.outputs.tag }}
    # repository secrets; secrets of the `production` environment are resolved by the environment of the called job
    secrets: inherit
